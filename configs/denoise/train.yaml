# DFPIR-style Denoising Training Config
# ======================================
# Dataset: BSD400 + WED merged clean pool, online Gaussian noise σ∈{15,25,50}
# Model:   ELIR E2E (FMIR + MMSE + WaveletStem→TanhSFT Decoder)
#
# 用法:
#   python train.py -y configs/denoise/train.yaml
#
# 你只需修改下面两处路径:
#   train_dataset.paths: [BSD400_path, WED_path]
#   val_dataset.paths:   [val_path]  (可用 CBSD68 子集或同训练集)

env_cfg:
  run_name: elir_denoise_bsd400_wed
  project_name: elir
  task: e2e
  out_dir: ./runs
  seed: 2025

dataset_cfg:
  train_dataset:
    name: Denoising
    paths:                                                   # <-- 改这里
      - ~/moxt/Datasets/Denoising/BSD400
      - ~/moxt/Datasets/Denoising/WED
    patch_size: 256
    batch_size: 8
    num_workers: 8
    training: true
    sigma_choices: [15, 25, 50]
  val_dataset:
    name: Denoising
    paths:                                                   # <-- 验证集（单sigma）
      - ~/moxt/Datasets/Denoising/CBSD68
    patch_size: 256
    batch_size: 1
    num_workers: 4
    training: false
    sigma_choices: [25]

fm_cfg:
  method: charbonnier_ssim_cfm_loss
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001
  sigma_s: 0.1
  dt: 0.05
  alpha: 0.001
  beta: 0.001
  lambda_pix_max: 0.5
  lambda_pix_warmup_steps: 10000
  detach_latent_path: false
  lambda_charb: 1.0
  lambda_ssim: 0.5
  gradient_clip_val: 1.0
  grad_accum: 1

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025,
               dynamic_noise: true, force_static_noise: false,
               detach_latent_path: false}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,2,2], n_mid_blocks: 4, in_channels: 16, hid_channels: 192,
                 out_channels: 16, t_emb_dim: 160, overparametrization: false,
                 use_checkpoint: true, use_attn: true, attn_heads: 8,
                 use_time_dilate: false}
        trainable: true
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 128, n_rrdb: 4, overparametrization: true}
        trainable: true
      enc_cfg:
        name: taesd
        trainable: false
      dec_cfg:
        name: sft_taesd_finetuner
        path:
        trainable: true
        params:
          latent_channels: 16
          gamma_scale: 0.1
          beta_scale: 0.1
      wavelet_cfg:
        enabled: true
        in_channels: 3
        base_channels: 16
        trainable: true
        band_attn: true
        fmir_use_wavelet_cond: true
    path:                                                    # <-- 可选: 预训练权重
  teacher_cfg:
    name: taesd
    params: {}
    trainable: false

train_cfg:
  train_mode: e2e
  epochs: -1
  ckpt_path:
  optimizer: !name:torch.optim.AdamW
  lr: 0.0001
  optimizer_params: {}
  ema_decay: 0.999
  max_steps: 300000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: true
  strategy: auto
  devices: 1
  accelerator: gpu

eval_cfg:
  metrics: [psnr, ssim]
  save_images: false
  max_save_images: 5
