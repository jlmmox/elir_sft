# 端到端模型评估（去雨 / Derain）
# 用法：python eval.py -y configs/derain/eval.yaml

env_cfg:
  seed: 2025

dataset_cfg:
  val_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/syn_rain/test/Rain100L
    lq_subdir: lq
    hq_subdir: hq
    patch_size: null
    batch_size: 1
    num_workers: 0
    training: false
    use_latent_cache: false

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg:
        k_steps: 5
        sigma_s: 0.1
        latent_shape: [16,64,64]
        seed: 2025
        dynamic_noise: true
        force_static_noise: false
        detach_latent_path: false
        ablation_skip_fmir: true
        # 跳过注入到 Decoder 的空间条件权重
        ckpt_skip_prefixes:
          - "dec.sft_32."
          - "dec.sft_64."
          - "dec.sft_128."
          - "dec.sft_256."
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,2,2], n_mid_blocks: 4, in_channels: 16, hid_channels: 192,
                 out_channels: 16, t_emb_dim: 160, overparametrization: false,
                 use_attn: false, attn_heads: 8}
        trainable: false
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 128, n_rrdb: 4, overparametrization: True}
        trainable: false
      enc_cfg:
        name: tiny_enc
        trainable: false
      dec_cfg:
        name: sft_taesd_finetuner
        path:
        trainable: false
        params:
          latent_channels: 16
          gamma_scale: 0.1
          beta_scale: 0.1
      wavelet_cfg:
        enabled: true
        in_channels: 3
        base_channels: 16
        use_ll: true
        fuse_with_spatial: true
        band_attn: true
        fmir_use_wavelet_cond: true
        trainable: false
        visualize: false
    # 替换为你的 derain 最佳 checkpoint
    path:
  teacher_cfg: null

eval_cfg:
  ckpt_path: /home/a27/moxt/elir_sftunet_ED/runs/elir_e2e_large_derain/epoch=2239-step=56000.ckpt
  metrics: [psnr, fid, ssim]
  use_tta: false
  test_y_channel: true
  save_images: true
  max_save_images: 4
  out_dir: ./runs/eval_e2e_large_derain
