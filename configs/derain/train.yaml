# 端到端训练（去雨 / Derain）：FMIR + MMSE + Decoder (WaveletStem→TanhSFT) 联合优化
# 损失：FM 流匹配 + Charbonnier + SSIM + LPIPS 感知 + Hinge GAN
#
# 用法：
#   python train.py -y configs/derain/train.yaml

env_cfg:
  run_name: elir_e2e_large_derain
  project_name: elir
  task: derain
  out_dir: ./runs
  seed: 2025

dataset_cfg:
  train_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/rain
    lq_subdir: lq
    hq_subdir: hq
    lq_to_hq_name:
      rain: norain
    patch_size: 256
    batch_size: 8
    num_workers: 4
    training: true
    use_latent_cache: false
  val_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/syn_rain/test/Rain100L
    lq_subdir: lq
    hq_subdir: hq
    patch_size: 256
    batch_size: 1
    num_workers: 1
    training: false
    use_latent_cache: false

fm_cfg:
  method: e2e_gan
  k_steps: 5
  lambda_fm: 1.0
  lambda_mmse_char: 0.10        # MMSE→HQ 对齐（从头训练恢复）
  t_emb_dim: 160
  sigma_min: 0.00001             # 恢复原值，low_t target 已正确处理 σ_min
  sigma_s: 0.1                   # 旧字段保留兼容
  train_noise_scale: 0.10        # 训练 CFM 噪声强度（新增）
  inference_noise_scale: 0.0     # 推理噪声=0，clean start
  alpha: 0.001
  beta: 0.001
  lambda_pix_max: 1
  lambda_pix_warmup_steps: 5000
  detach_latent_path: false
  # 像素损失权重
  lambda_charb: 1.0
  lambda_ssim: 0.5
  lambda_color: 0.05
  lambda_blur: 0
  prefer_lpips: true
  # 感知/对抗损失（PSNR 优化期全部关闭）
  lambda_perc: 0
  lambda_gan: 0.0
  d_lr: 0.00004
  d_base_channels: 64
  d_n_layers: 3
  # GAN/感知 warmup：前 N 步 λ 线性从 0 增长到目标值
  gan_perc_warmup_steps: 20000
  # 梯度裁剪
  gradient_clip_val: 1.0
  grad_accum: 1
  dino_align: false
  sk_fusion: false
  dino_perceptual: false
  lambda_dino: 0.0
  # 训练控制
  t_sampling: uniform
  use_latent_cond: false
  # ---- 跳过注入到 Decoder 的空间条件权重（测试去雨任务中空间信息的影响） ----
  ckpt_skip_prefixes:
    - "dec.sft_32."
    - "dec.sft_64."
    - "dec.sft_128."
    - "dec.sft_256."
  lr_min_ratio: 0.01
  lambda_bridge: 0.0
  lambda_final_latent: 0.0
  # ---- t=0 校准分支 ----
  lambda_low_t_endpoint: 0.05    # clean t=0 latent endpoint 监督
  low_t_endpoint_t: 0.0          # 推理起点 t=0
  lambda_flow_img: 0.0           # 关闭旧的单步 pixel calibration
  lambda_ssim_calib: 0.0
  lambda_mmse_guard: 0.0
  bridge_detach_mmse: true
  bridge_detach_cond: true
  # ---- K-step ODE 终点 pixel 监督（新增） ----
  lambda_ode_pixel: 0.10         # ODE 终点 Charbonnier
  lambda_ode_ssim: 0.02          # ODE 终点 SSIM
  # ---- 逐样本 improvement 约束（新增） ----
  lambda_flow_improve: 0.20      # pixel: FMIR 不得劣于 MMSE
  flow_improve_margin: 0.0
  lambda_latent_improve: 0.05    # latent: FMIR 不得劣于 MMSE
  latent_improve_margin: 0.0
  # ODE loss warmup（初期 MMSE/Decoder 未稳）
  ode_loss_start_step: 5000
  ode_loss_warmup_steps: 10000

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025,
               dynamic_noise: true, force_static_noise: false,
               detach_latent_path: false, inference_noise_scale: 0.0}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,2,2], n_mid_blocks: 4, in_channels: 16, hid_channels: 192,
                 out_channels: 16, t_emb_dim: 160, overparametrization: false,
                 use_checkpoint: true, use_attn: false, attn_heads: 8,
                 use_time_dilate: false, zero_init_velocity_head: true}
        trainable: true          # E2E 训练中启用 FMIR
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 128, n_rrdb: 4, overparametrization: True}
        trainable: true          # 从头训练
      enc_cfg:
        name: tiny_enc
        trainable: false
      dec_cfg:
        name: sft_taesd_finetuner
        path:
        trainable: true          # 从头训练
        params:
          latent_channels: 16
          gamma_scale: 0.1
          beta_scale: 0.1
      wavelet_cfg:
        enabled: true
        in_channels: 3
        base_channels: 16
        trainable: true          # 从头训练
        band_attn: true
        fmir_use_wavelet_cond: true
    path:                        # 从头训练，不加载任何旧 checkpoint
  teacher_cfg:
    name: tiny_enc
    params: {}
    trainable: false

train_cfg:
  train_mode: e2e                 # 完整端到端训练
  epochs: -1
  ckpt_path:
  optimizer: !name:torch.optim.AdamW
  lr: 0.0002
  enc_lr_mult: 0.1
  optimizer_params: {}
  ema_decay: 0.999
  max_steps: 400000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 70
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: true
  strategy: auto
  devices: 1
  accelerator: gpu
  precision: "32-true"

eval_cfg:
  metrics: [psnr, fid, ssim]
  save_images: false
  max_save_images: 4

log_cfg:
  level: normal
  train_log_interval: 100
  grad_log_interval: 500
  log_module_grad_norms: true
  log_memory: false
  debug_fmir_params: false
  debug_fmir_updates: false
  debug_cfm_details: false
  debug_validation_graph: false
  print_parameter_names: false
