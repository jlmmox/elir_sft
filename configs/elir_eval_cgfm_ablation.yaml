# Evaluation config for single-stage Latent CGFM (TAESD baseline)
# Usage:
#   python eval.py -y configs/elir_eval_cgfm_ablation.yaml

env_cfg:
  seed: 2025

dataset_cfg:
  val_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/RESIDE/SOTS/outdoor/test
    lq_subdir: haze
    hq_subdir: clear
    patch_size: null
    batch_size: 1
    num_workers: 1
    training: false
    use_latent_cache: false

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg:
        k_steps: 20
        sigma_s: 0.1
        latent_shape: [4, 32, 32]
        seed: 2025
        # Deterministic eval behavior.
        dynamic_noise: false
        force_static_noise: true
        detach_latent_path: true
      fmir_cfg:
        name: lunet
        params:
          ch_mult: [1, 2, 1, 2]
          n_mid_blocks: 3
          in_channels: 4
          hid_channels: 128
          out_channels: 4
          t_emb_dim: 160
          overparametrization: true
          use_cgfm: true
          cond_in_channels: 3
          cond_downscale_factor: 8
          cond_base_channels: 32
          cond_pyramid_channels: [32, 48, 64]
          gate_w_min: 0.1
          gate_p: 1.5
          sft_gamma_scale: 0.1
          sft_beta_scale: 0.1
        trainable: false
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 4, c_hid: 96, n_rrdb: 3, overparametrization: true}
        trainable: false
      enc_cfg:
        name: sdvae
        trainable: false
      dec_cfg:
        name: sdvae
        trainable: false

    # Replace with your trained checkpoint.
    path: ./runs/dehazing_reside_cgfm_latent/last.ckpt

eval_cfg:
  metrics: [psnr, fid, ssim]
  save_images: true
  max_save_images: 8
  out_dir: ./runs/eval_cgfm_latent
