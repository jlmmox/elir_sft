env_cfg:
  seed: 2025

dataset_cfg:
  val_dataset:
    name: Paired
    path: /path/to/test_root   # contains lq/ and hq/
    lq_subdir: lq
    hq_subdir: hq
    batch_size: 4
    patch_size: 512
    num_workers: 4

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}
        trainable: false
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}
        trainable: false
      enc_cfg: {name: taesd, trainable: false}
      dec_cfg: {name: taesd, trainable: false}
    path: /path/to/your_checkpoint.ckpt  # set to your trained weight

eval_cfg:
  metrics: ["psnr", "fid", "ssim"]
  image_size: 512
  save_images: true
  out_dir: ./runs/eval_deblur
