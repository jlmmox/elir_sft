# Evaluation config for ELIR dehazing (Stage 2 SFT).
# Usage:
#   python eval.py -y configs/elir_eval_dehazing.yaml

env_cfg:
  seed: 2025

dataset_cfg:
  val_dataset:
    name: RESIDE
    path: /home/a27/moxt/DiffUIR/Datasets/Restoration/RESIDE/SOTS/outdoor/test
    lq_subdir: lq
    hq_subdir: hq
    patch_size: null
    batch_size: 1
    num_workers: 4
    training: false
    use_latent_cache: false

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg:
        k_steps: 15
        sigma_s: 0.1
        latent_shape: [16,64,64]
        seed: 2025
        dynamic_noise: false        # 测试时必须关闭动态噪声
        force_static_noise: true    # 【修改1】强制静态噪声对齐，保证 SFT 基底绝对稳定
        detach_latent_path: true    # 【修改2】对齐 Stage 2 配置，彻底切断前置梯度图
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}
        trainable: false
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}
        trainable: false
      enc_cfg:
        name: taesd
        trainable: false
      dec_cfg:
        name: taesd
        trainable: false
      # 【修改3】必须补充 SFT 配置，否则模型加载时会静默丢弃 SFT 权重！
      sft_cfg:
        trainable: false            # 测试阶段严禁计算梯度
        params:
          in_channels: 3
          out_channels: 3
          hidden_channels: 16

    # 【注意】确保这里的路径是指向你 Stage 2 (SFT 微调后) 的权重！
    path: /home/a27/moxt/elir_sft/runs/dehazing_reside_stage2/epoch=1-step=100000.ckpt

eval_cfg:
  # image_size: 256  # 【修改4】建议注释或删除。模型内部已有 pad-forward-crop 完美对齐，外部无需限制尺寸
  metrics: [psnr, fid, ssim]
  save_images: true
  max_save_images: 4
  out_dir: ./runs/eval_hazing_dectrain
