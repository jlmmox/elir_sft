# Evaluation configuration for LOL (Low-Light Enhancement).
#
# Dataset layout example:
#   /path/to/LOL/val/
#       low/
#           0001.png
#           0002.png
#           ...
#       high/
#           0001.png
#           0002.png
#           ...
#
# Usage:
#   python eval.py -y configs/elir_eval_lol.yaml

env_cfg:
  seed: 2025

dataset_cfg:
  val_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/test
    lq_subdir: low
    hq_subdir: high
    patch_size: null         # keep original resolution; if variable sizes, keep batch_size=1
    batch_size: 1
    num_workers: 4
    training: false

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025,
               dynamic_noise: false,     # false=?????true=????????
               force_static_noise: false # true ???????? self.noise??? dynamic_noise?
      }
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}  # ???? U-Net ???????
        trainable: false                                    # ?????????
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}  # MMSE ????
        trainable: false                                                         # ????? MMSE ??
      enc_cfg:
        name: taesd
        trainable: false
      dec_cfg:
        name: taesd
        trainable: False
      sft_cfg:
        trainable: false           # ?? false ??? SFT_Refiner
        params: { in_channels: 3, out_channels: 3, hidden_channels: 16 }
    path: /home/a27/moxt/elir_sft/runs/lol_train_dectrain/epoch=2586-step=150000.ckpt                   # ????????? elir ????
  teacher_cfg: { name: taesd,
                 params: { },
                 trainable: False }


eval_cfg:
  metrics: [psnr, ssim, fid]
  save_images: true
  max_save_images: 5
  out_dir: ./runs/eval_lol_dectrain
