# Example eval config for paired deblurring

# ###########################################
# Setup Configuration
# ###########################################
env_cfg:
  seed: 2025

# -------------------------------------------------
# Dataset (paired LQ/HQ for testing)
# -------------------------------------------------
dataset_cfg:
  val_dataset:
    name: Paired
    path: /path/to/test_root   # expects path/lq and path/hq
    lq_subdir: lq
    hq_subdir: hq
    batch_size: 4
    patch_size: 512
    num_workers: 4

# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [4,64,64], seed: 2025}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 4, hid_channels: 128, out_channels: 4,
                 t_emb_dim: 160, overparametrization: False}
        trainable: False
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 4, c_hid: 96, n_rrdb: 3, overparametrization: False}
        trainable: False
      enc_cfg: {name: tiny_enc, trainable: False}
      dec_cfg: {name: tiny_dec, trainable: False}
    path: /path/to/elir_deblur.pth  # set to your trained weight

# -------------------------------------------------
# Evaluation
# -------------------------------------------------
eval_cfg:
  metrics: ["psnr", "fid", "ssim"]
  # image_size: 512  # 娉ㄩ噴鎺変互閬垮厤缂╂斁锛屼繚鎸佸師鍥惧昂瀵?  chop: { sf: 1, upscale: 1, chop_size: 256, chop_stride: 224 }  # 鍚敤chop锛屼繚鎸佸師鍥惧昂瀵?
