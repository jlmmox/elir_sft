# Training configuration for single-stage latent-space CGFM (TAESD baseline)
# Target GPU budget: 24GB

env_cfg:
  run_name: dehazing_reside_cgfm_latent
  project_name: elir
  task: dehazing
  out_dir: ./runs
  seed: 2025

# -------------------------------------------------
# Dataset (RESIDE OTS/SOTS)
# -------------------------------------------------
dataset_cfg:
  train_dataset:
    name: RESIDE
    path: ~/moxt/DiffUIR/Datasets/Restoration/RESIDE/OTS_ALPHA/train
    lq_subdir: lq
    hq_subdir: hq
    patch_size: 256
    batch_size: 1
    num_workers: 4
    training: true
    use_latent_cache: false
  val_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/RESIDE/SOTS/outdoor/test/val
    lq_subdir: haze
    hq_subdir: clear
    patch_size: 256
    batch_size: 1
    num_workers: 1
    training: false
    use_latent_cache: false

# -------------------------------------------------
# Flow-Matching + CGFM loss setup
# -------------------------------------------------
fm_cfg:
  method: l2_cfm_mse_loss
  k_steps: 20
  t_emb_dim: 160
  sigma_min: 0.00001
  sigma_s: 0.1
  dt: 0.05
  alpha: 0.001
  beta: 0.001
  # Pixel supervision warmup: lambda_pix ramps from 0 -> 0.5 in first 10k steps.
  lambda_pix_max: 0.5
  lambda_pix_warmup_steps: 10000

# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg:
        k_steps: 20
        sigma_s: 0.1
        # patch_size=256 with TAESD x8 downsampling => latent H,W = 32.
        # SD-VAE uses 4 latent channels.
        latent_shape: [4, 32, 32]
        seed: 2025
        dynamic_noise: true
        force_static_noise: false
      fmir_cfg:
        name: lunet
        params:
          ch_mult: [1, 2, 2, 2]
          n_mid_blocks: 3
          in_channels: 4
          hid_channels: 128
          out_channels: 4
          t_emb_dim: 160
          overparametrization: true
          use_cgfm: true
          cond_in_channels: 3
          cond_downscale_factor: 8
          cond_base_channels: 32
          cond_pyramid_channels: [32, 48, 64]
          gate_w_min: 0.1
          gate_p: 1.5
          sft_gamma_scale: 0.1
          sft_beta_scale: 0.1
        trainable: true
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 4, c_hid: 96, n_rrdb: 3, overparametrization: true}
        trainable: true

      enc_cfg:
        name: sdvae
        trainable: false
      dec_cfg:
        name: sdvae
        trainable: false

    path: null

  teacher_cfg: { name: sdvae,
                 params: { },
                 trainable: false }
# -------------------------------------------------
# Training
# -------------------------------------------------
train_cfg:
  epochs: -1
  ckpt_path:
  optimizer: !name:torch.optim.AdamW
  lr: 0.0001
  optimizer_params: {}
  ema_decay: 0.999
  max_steps: 100000
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: false
  strategy: auto
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  accumulate_grad_batches: 2

eval_cfg:
  metrics: ["psnr", "fid", "ssim"]
