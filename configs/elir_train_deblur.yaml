# Example,config for paired-image deblurring training
,
# ###########################################
# Setup Configuration
# ###########################################
env_cfg:
  run_name: deblur_paired          # 瀛愮洰褰曞悕锛屾墍鏈夎緭鍑哄啓鍒?out_dir/run_name
  project_name: elir               # 浠?wandb 鐢ㄧ殑椤圭洰鍚?  task: deblur                     # 浠诲姟鏍囩锛堜笉褰卞搷浠ｇ爜閫昏緫锛屼粎璁板綍锛?  out_dir: ./runs                  # 璁粌杈撳嚭鏍圭洰褰?  seed: 2025                       # 闅忔満绉嶅瓙

# -------------------------------------------------
# Dataset (paired LQ/HQ)
# -------------------------------------------------
dataset_cfg:
  train_dataset:
    name: Paired                    # 浣跨敤鎴愬 loader锛坮oot/lq 涓?root/hq锛?    path: /path/to/train_root       # 璁粌闆嗘牴鐩綍
    lq_subdir: lq                   # 閫€鍖栧浘瀛愮洰褰曞悕
    hq_subdir: hq                   # 骞插噣鍥惧瓙鐩綍鍚?    batch_size: 8                   # 璁粌 batch 澶у皬
    patch_size: 512                 # 鍙€?resize 鍒版灏哄锛孨one 鍒欎笉缂╂斁
    num_workers: 8                  # DataLoader workers 鏁?  val_dataset:
    name: Paired                    # 楠岃瘉/娴嬭瘯闆?loader
    path: /path/to/val_root         # 楠岃瘉闆嗘牴鐩綍
    lq_subdir: lq
    hq_subdir: hq
    batch_size: 4                   # 楠岃瘉 batch 澶у皬
    patch_size: 512                 # 楠岃瘉鏃剁殑 resize 灏哄
    num_workers: 4                  # 楠岃瘉 DataLoader workers

# -------------------------------------------------
# Flow-Matching
# -------------------------------------------------
fm_cfg:
  method: l2_cfm_mse_loss           # flow-matching 鎹熷け绫诲瀷
  k_steps: 5                        # 閲囨牱姝ユ暟
  t_emb_dim: 160                    # 鏃堕棿宓屽叆缁村害
  sigma_min: 0.00001                # 鏈€灏忓櫔澹?  sigma_s: 0.1                      # 鍒濆鍣０寮哄害
  dt: 0.05                          # 鏃堕棿姝ラ暱
  alpha: 0.001                      # 鎹熷け鏉冮噸锛堣 loss 瀹炵幇锛?  beta: 0.001                       # 鎹熷け鏉冮噸锛堣 loss 瀹炵幇锛?
# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}
        trainable: True
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}
        trainable: True
      enc_cfg: {name: taesd, trainable: False}
      dec_cfg: {name: taesd, trainable: False}
    path: null
  teacher_cfg: null

# -------------------------------------------------
# Training
# -------------------------------------------------
train_cfg:
  epochs: 400                       # 璁粌杞暟
  ckpt_path: null                   # 鑻ョ画璁紝濉叆 checkpoint 璺緞锛涘惁鍒欑暀绌?  optimizer: !name:torch.optim.AdamW # 浼樺寲鍣ㄧ被鍨?  lr: 0.0001                       # 瀛︿範鐜?  optimizer_params: {}             # 棰濆浼樺寲鍣ㄥ弬鏁?  ema_decay: 0.999                 # EMA 琛板噺锛? 鍏抽棴 EMA
  max_steps: -1                    # -1 琛ㄧず涓嶉檺鍒舵鏁?  check_val_every_n_epoch: 3       # 姣?N 杞仛涓€娆￠獙璇?  num_sanity_val_steps: 2          # sanity check 姝ユ暟
  wandb: False                     # 鏄惁鍚敤 Weights & Biases 鏃ュ織
  logger: csv                      # 鏈湴鏃ュ織锛歝sv / tensorboard / none
  save_images: True                # 楠岃瘉鏃舵槸鍚﹀瓨鏍蜂緥鍥?  save_weights_only: False         # checkpoint 鏄惁鍙瓨鏉冮噸锛汧alse 浠ヤ究淇濆瓨浼樺寲鍣ㄧ姸鎬佷究浜庣画璁?  # single-GPU setup
  strategy: auto                   # Lightning strategy锛屽崟鍗＄敤 auto/None
  devices: 1                       # 浣跨敤鐨勮澶囨暟閲?  accelerator: gpu                 # 鍔犻€熷櫒绫诲瀷锛孋PU 鍒欒 cpu

# -------------------------------------------------
# Evaluation
# -------------------------------------------------
eval_cfg:
  metrics: ["psnr", "fid", "ssim"]  # 璇勪及鎸囨爣鍒楄〃
  image_size: 512                   # 璇勬祴鏃剁殑 resize 灏哄

