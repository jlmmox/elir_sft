env_cfg:
  run_name: elir_e2e_large_lol_bridge_fmir_ft
  project_name: elir
  task: e2e
  out_dir: ./runs
  seed: 2025

dataset_cfg:
  train_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/train
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 8
    num_workers: 8
    training: true
    use_latent_cache: false

  val_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/test
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 4
    num_workers: 4
    training: false
    use_latent_cache: false

fm_cfg:
  method: e2e_gan
  bridge_mode: one_step_residual
  lambda_one_step_residual: 10
  lambda_one_step_endpoint: 10
  one_step_t: 0.5
  one_step_use_cond: true
  # ODE / CFM
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001

  # 续训阶段建议无噪声，和你 ablation 里 D_no_noise_ode 对齐
  sigma_s: 0.0
  dt: 0.05
  alpha: 0.001

  # 关闭旧 CFM endpoint，避免和 bridge final_latent 拉扯
  beta: 0.0

  # 保留一点 pixel loss，让 FMIR 输出通过冻结 decoder 后更贴近 HQ
  lambda_pix_max: 0
  lambda_pix_warmup_steps: 2000
  lambda_charb: 1.0
  lambda_ssim: 0.5
  lambda_color: 0.0
  lambda_blur: 0.0

  # 不开 DINO / GAN / perceptual
  dino_align: false
  sk_fusion: false
  dino_perceptual: false
  lambda_dino: 0.0
  prefer_lpips: true
  lambda_perc: 0.0
  lambda_gan: 0.0

  d_lr: 0.00004
  lr_min_ratio: 0.01
  d_base_channels: 64
  d_n_layers: 3
  gan_perc_warmup_steps: 20000

  # Conditional Flow-based Latent Refinement Bridge
  # 只让 FMIR 学：X_mmse -> X_hq
  lambda_bridge: 0
  lambda_final_latent: 0

  # 不加噪声，避免从强 MMSE 起点偏移
  bridge_sigma_s: 0.0

  # 不随机 K，固定 K=3，加速
  bridge_random_k: [5]

  # MMSE / cond 只读，防止破坏强 baseline
  bridge_detach_mmse: true
  bridge_detach_cond: true

  # 梯度裁剪
  gradient_clip_val: 1.0
  grad_accum: 1

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg:
        k_steps: 5
        sigma_s: 0.0
        latent_shape: [16, 64, 64]
        seed: 2025
        dynamic_noise: false
        force_static_noise: false
        detach_latent_path: false

      fmir_cfg:
        name: lunet
        params:
          ch_mult: [1, 2, 2, 2]
          n_mid_blocks: 4
          in_channels: 16
          hid_channels: 192
          out_channels: 16
          t_emb_dim: 160
          overparametrization: false
          use_checkpoint: true
          use_attn: true
          attn_heads: 8
          use_time_dilate: false
        trainable: true

      # 冻结强 MMSE，保持 decode(MMSE)≈25 不掉
      mmse_cfg:
        name: rrdbnet
        params:
          c_inout: 16
          c_hid: 128
          n_rrdb: 4
          overparametrization: true
        trainable: false

      # encoder 继续冻结
      enc_cfg:
        name: taesd
        trainable: false

      # 冻结强 decoder，保持 SFT_dec(HQ)≈31 不掉
      dec_cfg:
        name: sft_taesd_finetuner
        path:
        trainable: false
        params:
          latent_channels: 16
          gamma_scale: 0.1
          beta_scale: 0.1

      # 冻结 wavelet/condition，防止 condition 分布漂移
      wavelet_cfg:
        enabled: true
        in_channels: 3
        base_channels: 16
        trainable: false
        mode: lfg_sfg
        band_attn: true
        fmir_use_wavelet_cond: true
        gate_bias_init: -2.0
        hf_init: small

    # 这里不要填，resume 用 train_cfg.ckpt_path
    path: /home/a27/moxt/elir_sftunet_ED/runs/elir_e2e_large_lol_bridge_fmir_ft/epoch=4-step=300.ckpt

  teacher_cfg:
    name: taesd
    params: {}
    trainable: false

train_cfg:
  train_mode: manual
  epochs: -1

  # 换成你之前那个 decode(MMSE)≈25、SFT_dec(HQ)≈31 的 baseline ckpt
  ckpt_path: #/home/a27/moxt/elir_sftunet_ED/runs/ovft_lfg_sfg/epoch=256-step=31097.ckpt

  optimizer: !name:torch.optim.AdamW

  # 微调只训 FMIR，学习率不要大
  lr: 0.0003
  optimizer_params: {}

  ema_decay: 0
  max_steps: 300
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 5
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: true
  strategy: auto
  devices: 1
  accelerator: gpu

eval_cfg:
  metrics: [psnr, fid, ssim]
  save_images: false
  max_save_images: 5
  fmir_scale_sweep: [ 1, 2, 5, 10 ]
  fmir_scale_sweep_t: 0.5
  fmir_scale_sweep_use_cond: true