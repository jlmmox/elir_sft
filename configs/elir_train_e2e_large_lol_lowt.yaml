# PMRF-style Low-t Rectified Flow Training
# z_mmse = posterior mean (MMSE estimate) → FMIR rectified flow → z_hq
#
# 核心原则（借鉴 PMRF）：
#   1. 保留 Flow Matching 公式：Xt = (1-t)*z0 + t*z1, v_target = z1 - z0
#   2. z0 = z_mmse（posterior mean），z1 = z_hq（HQ latent）
#   3. t 采样偏向 0：训练集中在推理起点 z_mmse 附近
#   4. sigma_s=0：residual 小，不加 noise
#   5. low-t endpoint：约束 t=0 处 velocity 方向
#   6. MMSE fidelity guard：z_mmse 不能被 FMIR 拉得更差
#   7. latent condition：注入 z_lq / z_mmse-z_lq 到 FMIR
#   8. 纯 latent 训练：关闭 pixel/GAN/perceptual
#
# 诊断目标：cosine(v_pred, z_hq - z_mmse) > 0.2
#
# 用法：
#   python train.py -y configs/elir_train_e2e_large_lol_lowt.yaml

env_cfg:
  run_name: elir_e2e_large_lol_lowt
  project_name: elir
  task: e2e
  out_dir: ./runs
  seed: 2025

dataset_cfg:
  train_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/train
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 8
    num_workers: 8
    training: true
    use_latent_cache: false
  val_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/test
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 4
    num_workers: 4
    training: false
    use_latent_cache: false

fm_cfg:
  method: e2e_gan
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001

  # ==== 训练分布修正 ====
  sigma_s: 0.0                    # 不加 noise（residual 小，noise 会淹没有效信号）
  t_sampling: low_t               # 训练 t 集中在推理起点附近
  t_min: 0.0
  t_max: 0.3

  # ==== Flow Matching 保留 ====
  lambda_fm: 1.0
  lambda_mmse_char: 0.0            # MMSE→HQ Char 关闭（MMSE 已冻结 / 不需训练）
  dt: 0.05
  alpha: 0.001
  beta: 0.0                       # 关闭 CFM endpoint（由 low_t_endpoint 接管）

  # ==== Low-t endpoint 辅助 ====
  lambda_low_t_endpoint: 1.0      # 约束 t=0 处 velocity 方向
  low_t_endpoint_t: 0.0

  # ==== PMRF MMSE fidelity guard ====
  # z_mmse = posterior mean estimate；FMIR 不应把它拉得更差
  # 仅当 FMIR(z_mmse) 比 z_mmse 离 z_hq 更远时才产生 penalty
  lambda_mmse_guard: 1.0

  # ==== 潜在空间条件增强 ====
  use_latent_cond: true           # 注入 z_lq + z_mmse-z_lq 到 FMIR

  # ==== Bridge 关闭 ====
  lambda_bridge: 0.0
  lambda_final_latent: 0.0
  bridge_sigma_s: 0.0

  # ==== 像素 / GAN / 感知关闭（纯 latent 训练） ====
  lambda_pix_max: 0.0
  lambda_pix_warmup_steps: 10000
  lambda_charb: 0.0
  lambda_ssim: 0.0
  lambda_color: 0.0
  lambda_blur: 0.0
  lambda_perc: 0.0
  lambda_gan: 0.0
  lambda_dino: 0.0
  dino_align: false
  dino_perceptual: false
  sk_fusion: false

  d_lr: 0.00004
  lr_min_ratio: 0.01
  d_base_channels: 64
  d_n_layers: 3
  gan_perc_warmup_steps: 20000
  gradient_clip_val: 1.0
  grad_accum: 1

model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.0, latent_shape: [16,64,64], seed: 2025,
               dynamic_noise: true, force_static_noise: false,
               detach_latent_path: false,
               use_latent_cond: true}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,2,2], n_mid_blocks: 4, in_channels: 16, hid_channels: 192,
                 out_channels: 16, t_emb_dim: 160, overparametrization: false,
                 use_checkpoint: true, use_attn: true, attn_heads: 8,
                 use_time_dilate: false,
                 use_latent_cond: true}
        trainable: true
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 128, n_rrdb: 4, overparametrization: true}
        trainable: false
      enc_cfg:
        name: taesd
        trainable: false
      dec_cfg:
        name: sft_taesd_finetuner
        path:
        trainable: false            # e2e 模式强制 True；但 pixel decode 已跳过，SFT 无梯度
        params:
          latent_channels: 16
          gamma_scale: 0.1
          beta_scale: 0.1
      wavelet_cfg:
        enabled: true
        in_channels: 3
        base_channels: 16
        trainable: false
        band_attn: true
        fmir_use_wavelet_cond: true
    path:
  teacher_cfg:
    name: taesd
    params: {}
    trainable: false

train_cfg:
  train_mode: manual
  epochs: -1
  ckpt_path: /home/a27/moxt/elir_sftunet_ED/runs/ovft_lfg_sfg/epoch=256-step=31097.ckpt
  optimizer: !name:torch.optim.AdamW
  lr: 0.0003
  optimizer_params: {}
  ema_decay: 0
  max_steps: 1000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: true
  strategy: auto
  devices: 1
  accelerator: gpu

eval_cfg:
  metrics: [psnr, fid, ssim]
  save_images: false
  max_save_images: 5
  # FMIR scale sweep 诊断
  fmir_scale_sweep: [1, 2, 5, 10]
  fmir_scale_sweep_t: 0.0
  fmir_scale_sweep_use_cond: true
