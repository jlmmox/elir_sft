# ###########################################
# Setup Configuration
# ###########################################
env_cfg:
  run_name: lol_train_dectrain
  project_name: elir
  task: low_light_enhancement
  out_dir: ./runs
  seed: 2025


# -------------------------------------------------
# Dataset
# -------------------------------------------------
dataset_cfg:
  train_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/train
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 8
    num_workers: 8
    training: true
  val_dataset:
    name: LOL
    path: ~/moxt/DiffUIR/Datasets/Restoration/LOL/val
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 1
    num_workers: 1
    training: false


# -------------------------------------------------
# Flow-Matching
# -------------------------------------------------
fm_cfg:
  method: pixel_space_l2_cfm_loss
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001
  sigma_s: 0.1
  dt: 0.05
  alpha: 0.001
  beta: 0.001


# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025,
               dynamic_noise: false,     # false=?????true=????????
               force_static_noise: false # true ???????? self.noise??? dynamic_noise?
      }
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}  # ???? U-Net ???????
        trainable: false                                    # ?????????
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}  # MMSE ????
        trainable: false                                                        # ????? MMSE ??
      enc_cfg:
        name: taesd
        trainable: false
      dec_cfg:
        name: taesd
        trainable: true
      sft_cfg:
        trainable: true          # ?? false ??? SFT_Refiner
        params: { in_channels: 3, out_channels: 3, hidden_channels: 16 }
    path: /home/a27/moxt/elir_sft/runs/lol_train/epoch=8620-step=500000.ckpt                  # ????????? elir ????
  teacher_cfg: { name: taesd,
                 params: { },
                 trainable: False }


# -------------------------------------------------
# Training
# -------------------------------------------------
train_cfg:
  epochs: -1                      # ????
  ckpt_path:                  # ?????? checkpoint ???????
  optimizer: !name:torch.optim.AdamW # ?????
  lr: 0.0001                       # ???
  optimizer_params: {}             # ???????
  ema_decay: 0                 # EMA ???0 ?? EMA
  max_steps: 150000                    # -1 ???????
  check_val_every_n_epoch: 10      # ? N ??????
  num_sanity_val_steps: 2          # sanity check ??
  wandb: False                     # ???? Weights & Biases ??
  logger: csv                      # ?????csv / tensorboard / none
  save_images: false                # ?????????
  save_weights_only: false          # checkpoint ??????
  # single-GPU setup
  strategy: auto                   # Lightning strategy???? auto/None
  devices: 1                       # ???????
  accelerator: gpu                 # ??????CPU ?? cpu

eval_cfg:
  metrics: ["psnr", "fid", "ssim"]  # ??????

