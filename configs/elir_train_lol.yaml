# ###########################################
# Setup Configuration
# ###########################################
env_cfg:
  run_name: lol_train
  project_name: elir
  task: low_light_enhancement
  out_dir: ./runs
  seed: 2025


# -------------------------------------------------
# Dataset
# -------------------------------------------------
dataset_cfg:
  train_dataset:
    name: LOL
    path: /path/to/LOL/train
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 8
    num_workers: 8
    training: true
  val_dataset:
    name: LOL
    path: /path/to/LOL/val
    lq_subdir: low
    hq_subdir: high
    patch_size: 256
    batch_size: 4
    num_workers: 4
    training: false


# -------------------------------------------------
# Flow-Matching
# -------------------------------------------------
fm_cfg:
  method: l2_cfm_mse_loss
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001
  sigma_s: 0.1
  dt: 0.05
  alpha: 0.001
  beta: 0.001


# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [16,64,64], seed: 2025}
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,1,2], n_mid_blocks: 3, in_channels: 16, hid_channels: 128, out_channels: 16,
                 t_emb_dim: 160, overparametrization: True}
        trainable: True
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 16, c_hid: 96, n_rrdb: 3, overparametrization: True}
        trainable: True
      enc_cfg: {name: taesd, trainable: False}
      dec_cfg: {name: taesd, trainable: False}
    path: null
  teacher_cfg: null


# -------------------------------------------------
# Training
# -------------------------------------------------
train_cfg:
  epochs: 400
  ckpt_path: null
  optimizer: !name:torch.optim.AdamW
  lr: 0.0001
  optimizer_params: {}
  ema_decay: 0.999
  max_steps: -1
  check_val_every_n_epoch: 3


# -------------------------------------------------
# Evaluation
# -------------------------------------------------
eval_cfg:
  metrics: ["lpips", "psnr", "niqe"]

