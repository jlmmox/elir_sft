# Training configuration for image dehazing on the RESIDE (OTS/SOTS) dataset.
# Stage 1: Latent Flow Matching + Pixel MSE Supervision (4090 24GB 极限算力版)

env_cfg:
  run_name: dehazing_reside_pixel_ablation
  project_name: elir
  task: dehazing
  out_dir: ./runs
  seed: 2025

# -------------------------------------------------
# Dataset (RESIDE OTS/SOTS)
# -------------------------------------------------
dataset_cfg:
  train_dataset:
    name: RESIDE
    path: ~/moxt/DiffUIR/Datasets/Restoration/RESIDE/OTS_ALPHA/train
    lq_subdir: lq
    hq_subdir: hq
    patch_size: 256
    batch_size: 1
    num_workers: 4
    training: true
    use_latent_cache: false
  val_dataset:
    name: Paired
    path: ~/moxt/DiffUIR/Datasets/Restoration/RESIDE/SOTS/outdoor/test/val
    lq_subdir: haze
    hq_subdir: clear
    patch_size: 256
    batch_size: 1
    num_workers: 1
    training: false
    use_latent_cache: false

# -------------------------------------------------
# Flow-Matching
# -------------------------------------------------
fm_cfg:
  method: charbonnier_ssim_cfm_loss
  k_steps: 5
  t_emb_dim: 160
  sigma_min: 0.00001
  sigma_s: 0.1
  dt: 0.05
  alpha: 0.001
  beta: 0.001

# -------------------------------------------------
# Model
# -------------------------------------------------
model_cfg:
  arch_cfg:
    name: elir
    params:
      fm_cfg: {k_steps: 5, sigma_s: 0.1, latent_shape: [3,256,256], seed: 2025,
               dynamic_noise: true,
               force_static_noise: false
      }
      fmir_cfg:
        name: lunet
        params: {ch_mult: [1,2,4,8], n_mid_blocks: 3, in_channels: 3, hid_channels: 64, out_channels: 3,
                 t_emb_dim: 160, overparametrization: True, use_checkpoint: true}
        trainable: true
      mmse_cfg:
        name: rrdbnet
        params: {c_inout: 3, c_hid: 96, n_rrdb: 3, overparametrization: True}
        trainable: true
      sft_cfg:
        trainable: false
        params: { in_channels: 3, out_channels: 3, hidden_channels: 16 }
    path: null

# -------------------------------------------------
# Training
# -------------------------------------------------
train_cfg:
  epochs: -1
  ckpt_path:
  optimizer: !name:torch.optim.AdamW
  lr: 0.0001
  optimizer_params: {}
  ema_decay: 0.999
  max_steps: 100000
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  wandb: false
  logger: csv
  save_images: false
  save_weights_only: false
  strategy: auto
  devices: 1
  accelerator: gpu
  accumulate_grad_batches: 2

eval_cfg:
  metrics: ["psnr", "fid", "ssim"]